# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Android Antonio → Firebase App Distribution
#
#  Trigger: push to `antonio` branch
#  Runner:  ubuntu-latest
#
#  YARA pattern comparison:
#  - YARA: branch → select-runner → helm-environment → Vault path
#    → build-upload-android-config.yml → fastlane android beta
#  - demo_app_bk: branch `antonio` → this workflow
#    → inject ANDROID_BUILD_FLAVOUR=Antonio → fastlane android firebase_beta
#
#  WHY riêng workflow thay vì chung android-beta.yml:
#  - android-beta.yml dùng Google Play secrets (GOOGLE_PLAY_JSON_KEY_BASE64)
#  - antonio dùng Firebase secrets (ANDROID_ANTONIO_FIREBASE_APP_ID)
#  - Tách rõ ràng = dễ debug, dễ thêm env mới sau này
#  - Tương đương YARA: mỗi environment có vault path riêng
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Android Antonio → Firebase Distribution

on:
  push:
    branches:
      - antonio
    paths-ignore:
      - '**.md'
      - 'docs/**'

  # Cho phép trigger thủ công từ GitHub Actions UI
  # Dùng khi cần re-deploy mà không cần push code
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual release'

# Chỉ 1 build antonio chạy cùng lúc
# cancel-in-progress: true → build mới cancel build cũ đang chạy
concurrency:
  group: android-antonio
  cancel-in-progress: true

jobs:
  deploy-antonio:
    name: Build & Upload to Firebase Distribution
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Node.js ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── Java ──────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── Ruby + Bundler ────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # ─── JS Dependencies ───────────────────────────────────
      # WHY npm ci thay vì npm install:
      # npm ci đọc package-lock.json chính xác → reproducible builds.
      # npm install có thể update minor versions → builds khác nhau mỗi lần.
      - name: Install JS dependencies
        run: npm ci

      # ─── Gradle Cache ──────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── Android SDK ───────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── Keystore Setup ────────────────────────────────────
      # Dùng keystore riêng cho Antonio env (ANDROID_ANTONIO_KEYSTORE_BASE64)
      # Có thể dùng chung keystore với Prod nếu muốn đơn giản hơn
      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_ANTONIO_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/antonio.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/antonio.keystore" >> $GITHUB_ENV

      # ─── Fastlane firebase_beta ────────────────────────────
      # YARA pattern: inject ANDROID_BUILD_FLAVOUR=Antonio
      # → Fastfile đọc ENV["ANDROID_BUILD_FLAVOUR"]
      # → gradle builds AntonioRelease
      # → applicationId = com.demo_app.antonio
      # → firebase_app_distribution uploads AAB
      - name: Build & Upload to Firebase Distribution
        env:
          # Signing
          ANDROID_KEYSTORE_PATH:     ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_ALIAS:    ${{ secrets.ANDROID_ANTONIO_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ANTONIO_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_ANTONIO_KEY_PASSWORD }}
          # Firebase — App ID của com.demo_app.antonio
          FIREBASE_APP_ID:           ${{ secrets.ANDROID_ANTONIO_FIREBASE_APP_ID }}
          FIREBASE_GROUPS:           antonio-testers
          # YARA pattern: environment được inject qua env var
          ANDROID_BUILD_FLAVOUR:     Antonio
          APP_VERSION:               ${{ secrets.APP_VERSION }}
          # WHY github.run_number làm versionCode:
          # Firebase không yêu cầu incremental như Play Store.
          # github.run_number tăng đơn điệu mỗi lần CI chạy → đủ để distinguish builds.
          # YARA dùng github.run_number + 44070 (offset migration từ CI cũ).
          APP_VERSION_CODE:          ${{ github.run_number }}
          # Notifications
          SLACK_WEBHOOK_URL:         ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane android firebase_beta

      # ─── Upload artifacts ──────────────────────────────────
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app-antonio-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/antonio/release/app-antonio-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app-antonio-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/antonioRelease/app-antonio-release.aab
          retention-days: 14

      # ─── Cleanup ───────────────────────────────────────────
      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/antonio.keystore
