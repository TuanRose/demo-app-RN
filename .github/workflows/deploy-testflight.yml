# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  iOS Beta — Build + Upload to TestFlight
#
#  Trigger: push to main branch
#  Runner:  macos-15 (required — Xcode only runs on macOS)
#  Cost:    ~$0.08/min × ~25 min = ~$2/build (GitHub-hosted)
#
#  Estimated total time: 25-40 min
#  - npm ci:        2-3 min
#  - pod install:   5-10 min (with cache)
#  - gym build:     15-20 min
#  - pilot upload:  1-2 min
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: iOS Beta → TestFlight

on:
  push:
    branches:
      - main
    # WHY paths filter: only trigger on changes that actually affect the app.
    # Avoids wasting CI minutes on docs/README-only changes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/android-*.yml'
      - '.github/workflows/production.yml'

  # WHY workflow_dispatch: allows manual trigger from GitHub UI.
  # Use when releasing a hotfix without a new code push.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (leave a note in logs)'
        required: false
        default: 'Manual release'

# WHY concurrency: prevents 2 iOS builds running simultaneously on rapid pushes.
# cancel-in-progress: true → old build is cancelled, latest build continues.
concurrency:
  group: ios-beta
  cancel-in-progress: true

jobs:
  deploy-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-15

    steps:
      # ─── Checkout ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # WHY fetch-depth 0: fastlane uses git log to generate release notes.
          # Default fetch-depth 1 only fetches the latest commit — no history.
          fetch-depth: 0

      # ─── Node.js ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── Ruby + Bundler ────────────────────────────────────
      # WHY ruby/setup-ruby with bundler-cache: true:
      # Installing gems (fastlane, cocoapods) takes 3-5 min.
      # bundler-cache caches vendor/bundle → 30 sec on subsequent runs.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # ─── Xcode ─────────────────────────────────────────────
      # WHY pin Xcode version explicitly:
      # macos-15 runner may have multiple Xcode versions installed.
      # RN 0.85+ requires Xcode 15+. Omitting this may use an older version.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # ─── JS Dependencies ───────────────────────────────────
      # WHY npm ci instead of npm install:
      # ci = clean install, reads package-lock.json exactly.
      # install may update the lock file → not reproducible on CI.
      - name: Install JS dependencies
        run: npm ci

      # ─── CocoaPods Cache ───────────────────────────────────
      # WHY cache Pods:
      # pod install takes 5-10 min on first run.
      # Cache key = Podfile.lock hash → invalidated when dependencies change.
      # Cache hit → pod install takes only 30-60 sec (link only, no download).
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ─── Pod Install ───────────────────────────────────────
      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios

      # ─── Fastlane Build + Upload ───────────────────────────
      # All secrets injected via env vars — never hardcoded.
      # GitHub Actions Secrets are automatically masked in logs.
      - name: Build & Upload to TestFlight
        env:
          # App Store Connect API Key — not blocked by 2FA
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # App info
          APP_IDENTIFIER:  ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID:         ${{ secrets.TEAM_ID }}
          APP_VERSION:     ${{ secrets.APP_VERSION }}
          # Match (code signing)
          MATCH_GIT_URL:   ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          # Notifications
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane ios beta

      # ─── Upload build artifact (optional) ─────────────────
      # WHY: keep .ipa for debugging or direct QA distribution.
      # Expires after 7 days to avoid unnecessary storage usage.
      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app-${{ github.sha }}.ipa
          path: build/ios/demo_app.ipa
          retention-days: 7
