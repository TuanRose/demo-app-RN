# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Android QA → Firebase App Distribution
#
#  Trigger: push to `release/android` branch
#  Runner:  ubuntu-latest
#
#  YARA pattern comparison:
#  - YARA: branch → select-runner → helm-environment → Vault path
#    → build-upload-android-config.yml → fastlane android beta
#  - demo_app_bk: branch `release/android` → this workflow
#    → inject ANDROID_BUILD_FLAVOUR=Qa → fastlane android firebase_beta
#
#  WHY riêng workflow thay vì chung android-antonio.yml:
#  - antonio dùng ANDROID_ANTONIO_* secrets, qa dùng ANDROID_QA_* secrets
#  - Tách rõ ràng = dễ debug, dễ thêm env mới sau này
#  - Tương đương YARA: mỗi environment có vault path riêng
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Android QA → Firebase Distribution

on:
  push:
    branches:
      - release/android
    paths-ignore:
      - '**.md'
      - 'docs/**'

  # Cho phép trigger thủ công từ GitHub Actions UI
  # Dùng khi cần re-deploy mà không cần push code
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual release'

# Chỉ 1 build QA chạy cùng lúc
# cancel-in-progress: true → build mới cancel build cũ đang chạy
concurrency:
  group: android-qa
  cancel-in-progress: true

jobs:
  deploy-qa:
    name: Build & Upload to Firebase Distribution
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Node.js ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── Java ──────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── Ruby + Bundler ────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # ─── JS Dependencies ───────────────────────────────────
      # WHY npm ci thay vì npm install:
      # npm ci đọc package-lock.json chính xác → reproducible builds.
      # npm install có thể update minor versions → builds khác nhau mỗi lần.
      - name: Install JS dependencies
        run: npm ci

      # ─── Gradle Cache ──────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── Android SDK ───────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── Env files ─────────────────────────────────────────
      # WHY tạo ở đây thay vì commit: .env* bị gitignore (discipline không commit secrets).
      # QA build dùng .env.qa; .env là fallback cho Prod/Dev flavor khi dotenv.gradle scan.
      # Giá trị ở đây là mock public API → không phải secret thật → hardcode trong workflow OK.
      - name: Create env files
        run: |
          echo "API_BASE_URL=https://dummyjson.com" > .env
          echo "APP_ENV=prod" >> .env
          echo "API_BASE_URL=https://fakestoreapi.com" > .env.qa
          echo "APP_ENV=qa" >> .env.qa

      # ─── Keystore Setup ────────────────────────────────────
      # WHY dùng chung keystore với Antonio: QA không lên Play Store
      # → không cần keystore riêng → giảm secrets phải quản lý.
      # Nếu sau này cần tách → đổi secret names ANDROID_QA_* → ANDROID_QA_* riêng.
      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_QA_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/qa.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/qa.keystore" >> $GITHUB_ENV

      # ─── Fastlane firebase_beta ────────────────────────────
      # YARA pattern: inject ANDROID_BUILD_FLAVOUR=Qa
      # → Fastfile đọc ENV["ANDROID_BUILD_FLAVOUR"]
      # → gradle builds QaRelease
      # → applicationId = corleone.dev.demo_app.qa
      # → firebase_app_distribution uploads APK lên group qa-testers
      - name: Build & Upload to Firebase Distribution
        env:
          # Signing
          ANDROID_KEYSTORE_PATH:     ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_ALIAS:    ${{ secrets.ANDROID_QA_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_QA_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_QA_KEY_PASSWORD }}
          # Firebase — App ID của corleone.dev.demo_app.qa
          FIREBASE_APP_ID:           ${{ secrets.ANDROID_QA_FIREBASE_APP_ID }}
          FIREBASE_GROUPS:           qa-testers
          # WHY FIREBASE_TOKEN: CI runner không có browser → không thể firebase login.
          # Generate once: ./node_modules/.bin/firebase login:ci
          FIREBASE_TOKEN:            ${{ secrets.FIREBASE_TOKEN }}
          # YARA pattern: environment được inject qua env var
          ANDROID_BUILD_FLAVOUR:     Qa
          APP_VERSION:               ${{ secrets.APP_VERSION }}
          # WHY github.run_number làm versionCode:
          # Firebase không yêu cầu incremental như Play Store.
          # github.run_number tăng đơn điệu mỗi lần CI chạy → đủ để distinguish builds.
          APP_VERSION_CODE:          ${{ github.run_number }}
        run: bundle exec fastlane android firebase_beta

      # ─── Upload artifacts ──────────────────────────────────
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app-qa-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/qa/release/app-qa-release.apk
          retention-days: 1

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app-qa-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/qaRelease/app-qa-release.aab
          retention-days: 1

      # ─── Cleanup ───────────────────────────────────────────
      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/qa.keystore
