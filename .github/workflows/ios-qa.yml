# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  iOS QA — Build + Distribute to TestFlight & Firebase
#
#  Trigger: push to release/ios branch
#  Runner:  macos-15 (required — Xcode only runs on macOS)
#  Cost:    ~$0.08/min × ~35 min = ~$2.8/build (2 IPA builds)
#
#  Estimated total time: 35-50 min
#  - npm ci:            2-3 min
#  - pod install:       5-10 min (with cache)
#  - gym appstore:      15-20 min
#  - gym adhoc:         15-20 min (reuses same source)
#  - pilot + firebase:  2-3 min
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: iOS QA → TestFlight + Firebase

on:
  push:
    branches:
      - release/ios
    # WHY paths-ignore: skip CI for doc/markdown-only changes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/android-*.yml'
      - '.github/workflows/deploy-testflight.yml'
      - '.github/workflows/production.yml'

  # WHY workflow_dispatch: allows manual QA build from GitHub UI.
  # Use when QA team needs a fresh build without a code change.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual QA build'

# WHY concurrency: prevents 2 QA builds from running simultaneously.
# cancel-in-progress: true → old build cancelled, latest continues.
# WHY separate group from ios-beta: QA and beta can run in parallel.
concurrency:
  group: ios-qa
  cancel-in-progress: true

jobs:
  distribute-qa:
    name: Build QA → TestFlight + Firebase
    runs-on: macos-15

    steps:
      # ─── Checkout ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # WHY fetch-depth 0: fastlane uses git log -10 for release notes.
          # Default fetch-depth 1 only fetches latest commit → empty changelog.
          fetch-depth: 0

      # ─── Node.js ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ─── Ruby + Bundler ────────────────────────────────────
      # WHY bundler-cache: true: gems (fastlane, badge plugin, cocoapods)
      # take 3-5 min to install. Cache → 30 sec on subsequent runs.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # ─── Xcode ─────────────────────────────────────────────
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # ─── JS Dependencies ───────────────────────────────────
      - name: Install JS dependencies
        run: npm ci

      # ─── CocoaPods Cache ───────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ─── Pod Install ───────────────────────────────────────
      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios

      # ─── ImageMagick ───────────────────────────────────────────
      # WHY: fastlane-plugin-badge requires ImageMagick to stamp the QA shield
      # onto the app icon. macOS GitHub-hosted runners do not pre-install it.
      # librsvg improves SVG → PNG rendering quality for the shield overlay.
      - name: Install ImageMagick
        run: brew install imagemagick librsvg

      # ─── Write .env.qa ─────────────────────────────────────────
      # WHY: .env.qa is gitignored (contains API endpoints, feature flags).
      # gym passes ENVFILE=.env.qa to react-native-config — file must exist
      # on the runner before the build starts, not just at runtime.
      - name: Write .env.qa
        run: echo "${{ secrets.ENV_QA }}" > .env.qa

      # ─── Fastlane distribute_qa ────────────────────────────
      # Flow: build number ← ASC → badge icon → gym appstore → pilot
      #       → gym adhoc → firebase_app_distribution
      - name: Build QA & Distribute
        env:
          # App Store Connect API — service account, not blocked by 2FA
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # QA app identifiers
          QA_APP_IDENTIFIER: ${{ secrets.QA_APP_IDENTIFIER }}
          APP_IDENTIFIER:    ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID:           ${{ secrets.TEAM_ID }}
          APP_VERSION:       ${{ secrets.APP_VERSION }}
          # Match (code signing) — readonly: true in distribute_qa lane
          MATCH_GIT_URL:   ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          # Firebase App Distribution
          # WHY separate FIREBASE_IOS_QA_APP_ID: QA app is a different Firebase app
          # than production — different bundle ID → different Firebase App ID.
          FIREBASE_IOS_QA_APP_ID: ${{ secrets.FIREBASE_IOS_QA_APP_ID }}
          FIREBASE_TOKEN:         ${{ secrets.FIREBASE_TOKEN }}
        run: bundle exec fastlane ios distribute_qa

      # ─── Upload artifacts ──────────────────────────────────
      # WHY retain both IPAs: app-store IPA for TestFlight audit trail,
      # adhoc IPA for direct sideload if Firebase distribution fails.
      - name: Upload app-store IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app_qa-appstore-${{ github.sha }}.ipa
          path: build/ios/demo_app_qa.ipa
          retention-days: 7

      - name: Upload ad-hoc IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo_app_qa-adhoc-${{ github.sha }}.ipa
          path: build/ios/demo_app_qa_adhoc.ipa
          retention-days: 7
