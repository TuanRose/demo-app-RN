apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

// WHY: react-native-config đọc ENVFILE để biết load file nào.
// Map flavor name → env file; nếu không match thì fallback về .env (Prod).
project.ext.envConfigFiles = [
    Prod:    ".env",
    Dev:     ".env",
    Antonio: ".env",
    Qa:      ".env.qa",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.demo_app"

    defaultConfig {
        applicationId "corleone.dev.demo_app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // WHY project.findProperty thay vì hardcode:
        // - Fastlane truyền versionCode/versionName qua -P gradle properties
        // - Local build: gradle.properties hoặc dùng default dưới đây
        // - Không bao giờ hardcode version vào đây vì CI cần override tự động
        versionCode project.findProperty('versionCode')?.toInteger() ?: 1
        versionName project.findProperty('versionName') ?: "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // WHY đọc từ env var với fallback về debug keystore:
            // - CI (Fastlane): credentials được inject qua android.injected.signing.*
            //   Android Gradle Plugin xử lý những properties này và OVERRIDE signingConfig này.
            //   Nên thực tế trên CI, block này bị override hoàn toàn bởi Fastlane.
            // - Local build với release keystore: set ANDROID_KEYSTORE_* env vars
            // - Local build không có keystore: fallback về debug.keystore (không thể upload Play Store)
            //
            // TẠI SAO KHÔNG dùng debug keystore cho release build:
            // - debug.keystore không được Google tin tưởng
            // - APK/AAB ký bằng debug key sẽ bị Play Store reject
            // - Nếu publish nhầm debug-signed APK → phải tạo app ID mới (không thể update)
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            storeFile     ksPath ? rootProject.file(ksPath) : file('debug.keystore')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias      System.getenv('ANDROID_KEYSTORE_ALIAS')    ?: 'androiddebugkey'
            keyPassword   System.getenv('ANDROID_KEY_PASSWORD')       ?: 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // WHY signingConfig signingConfigs.release thay vì debug:
            // Bản gốc RN template dùng debug cho release — đây là BUG tiềm ẩn.
            // debug signingConfig → app ký bằng debug key → Play Store reject.
            // release signingConfig đọc từ env vars, Fastlane override bằng injected properties.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // YARA pattern: mỗi environment là một productFlavor riêng biệt
    // → applicationId khác nhau → cài song song trên cùng 1 device
    // → CI inject ANDROID_BUILD_FLAVOUR → Fastlane build đúng flavor
    flavorDimensions "environment"

    productFlavors {
        // Prod: applicationId = "corleone.dev.demo_app" (không suffix)
        // → đây là app trên Google Play Store
        Prod {
            dimension "environment"
        }

        // Dev: applicationId = "corleone.dev.demo_app.dev"
        // → cài song song với Prod trên device
        Dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "DemoApp Dev"
        }

        // Antonio: applicationId = "corleone.dev.demo_app.antonio"
        // → Firebase App Distribution (không lên Play Store)
        Antonio {
            dimension "environment"
            applicationIdSuffix ".antonio"
            resValue "string", "app_name", "DemoApp Antonio"
        }

        // Qa: applicationId = "corleone.dev.demo_app.qa"
        // → cài song song với Prod/Dev/Antonio trên cùng device
        // → Firebase App Distribution, trỏ QA backend
        Qa {
            dimension "environment"
            applicationIdSuffix ".qa"
            resValue "string", "app_name", "DemoApp QA"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
